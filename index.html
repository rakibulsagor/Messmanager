<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mess Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🧹 Mess Manager</h1>
        <p>Track messy areas and clean them up one task at a time.</p>
      </header>

      <section class="panel">
        <form id="mess-form" class="row">
          <label for="mess-input" class="sr-only">New mess task</label>
          <input
            id="mess-input"
            type="text"
            placeholder="e.g. Clean desk, take out trash"
            maxlength="120"
            required
          />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar row">
          <span id="stats">0 total • 0 cleaned • 0 pending</span>
          <button id="clear-done" type="button">Clear cleaned</button>
        </div>

        <ul id="mess-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="mess-item-template">
      <li class="mess-item">
        <label>
          <input type="checkbox" />
          <span class="task-text"></span>
        </label>
        <button type="button" class="delete" aria-label="Delete task">✕</button>
      </li>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
